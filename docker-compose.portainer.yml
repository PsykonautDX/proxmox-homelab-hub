# Portainer Stack Compose — Proxmox Homelab Hub (WebUI + Streamable HTTP MCP)
#
# Paste directly into Portainer -> Stacks -> + Add stack -> Web editor and click Deploy!
# Configure your Proxmox host, API token, iDRAC, TrueNAS, and safety mode right inside
# the WebUI (06 SYSTEM -> MCP & Settings). Everything persists automatically in `/app/data`.

services:
  proxmox-hub:
    image: ghcr.io/psykonautdx/proxmox-homelab-hub:latest
    container_name: proxmox-homelab-hub
    restart: unless-stopped
    ports:
      - "8806:8806"
    # For Wake-on-LAN UDP broadcast (255.255.255.255) to physical LAN devices,
    # comment out `ports:` above and uncomment `network_mode: host` below.
    # network_mode: host
    environment:
      - TZ=Europe/London
      # Optional: uncomment to preview with simulated demo data before adding an API token
      # - PROXMOX_DEMO_MODE=true
    volumes:
      - proxmox_hub_data:/app/data
      # Optional: mount a host SSH key (read-only) for 1-click Community Scripts
      # - /root/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro

volumes:
  proxmox_hub_data:
