# Proxmox Homelab Hub — Zero-Config Docker Compose (Portainer & CLI ready)
#
# Deploy as-is! No environment variables are required up front.
# Open http://<your-docker-host>:8806 -> 06 SYSTEM -> MCP & Settings to configure
# your Proxmox host, API token, iDRAC, TrueNAS, SSH, and safety mode directly in the WebUI.
# All settings persist automatically in the `proxmox_hub_data` volume (/app/data/.env).

services:
  proxmox-hub:
    image: ghcr.io/psykonautdx/proxmox-homelab-hub:latest
    container_name: proxmox-homelab-hub
    restart: unless-stopped
    ports:
      - "8806:8806"
    # For Wake-on-LAN UDP broadcast (255.255.255.255) to physical LAN devices,
    # comment out `ports:` above and uncomment `network_mode: host` below.
    # network_mode: host
    environment:
      - TZ=Europe/London
      # Optional: uncomment to start in Interactive Demo Mode immediately
      # - PROXMOX_DEMO_MODE=true
    volumes:
      - proxmox_hub_data:/app/data
      # Optional: mount a host SSH key (read-only) for 1-click Community Scripts
      # - /root/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro

volumes:
  proxmox_hub_data:
